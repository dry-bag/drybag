# The shape check's bound on a pass that is one repeat of one character alone. Python 3.11.4 counts
# an item it matches ignoring case through a class one character at a time, moving the pass's
# position as it goes, so such a repeat that needs two and finds one fails one past the pass's
# start, and a possessive group goes on from there: `(?i)(?:[a-z]{2,}|-)*+(.*)` leaves `1` of `-a1`
# to the tail, where 3.14 leaves `a1`. A letter with a second case fold is read through such a
# class, so `(?i)(?:s{2,}|-)*+` is the same shape. Without the bound the check admits both again.
