# is -- so the bound has to be applied again on the read or it is not a bound.
[[mutation]]
name = "doctor reads an environment-named log with no bound of its own"
file = "src/stayfixed/doctor/checks.py"
before = "        raw, over = fsops.read_bounded(log, DIAGNOSTICS_MAX_BYTES)"
