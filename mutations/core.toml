# Repository bytes never print unbounded, and this is the third leak of that family closed in this
# loader. `tomllib` builds its message as `f"{msg} (at line N, column M)"` and `msg` embeds the
# source for at least five of its own faults — a duplicate table, a duplicate inline-table key, a
# redefined namespace, an invalid character, an overwritten value. A TOML key is arbitrary quoted
# text, so interpolating the exception whole put unbounded repository bytes into a `ConfigError`
# and, through `project.init._existing`, into a refusal the `init` skill is instructed to relay to a
# model and stop on. Only the position prints, and the fallback reports an absent suffix rather than
# the message — a fallback to `str(exc)` is the one change that would reopen this silently. The
# sibling leak in the same loader function, the unknown-section list, is bounded to `SECTION_NAME`;
# this completes it, and one extractor serves all three call sites.
