# The records group: working memory and the project's documents.
# Which group an entry belongs in is `GROUP_OF` in `scripts/mutation_oracle.py`; what an entry is:
# CONTRIBUTING.md, "Tests".

# Two specified rules that no assertion discriminated: both mutations, `mutations/`'s
# "group_order outranks the startup rank in the index order" and "the volatile budget excludes the
# set that is exactly the budget", left all 617 tests green. The first decides which note leads a
# section and which sub-heading opens it; the second flips a note set sized exactly at the budget
# from full injection to descriptions only.
