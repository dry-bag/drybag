# --- setup and overlay: the structural refusal above the first write (PR 12 review) ---

# A defect that had a test named for it and no mutation: `claude plugin install superpowers@obra` on
# a fresh machine always failed, because a plugin cannot be installed from a marketplace that was
# never registered. The order is the fix, and the test asserted membership — `… in runner.calls` —
# so the swapped loops made every call it looked for and stayed green. This entry expresses the
# *move*, not a deletion: both calls still happen, in the wrong order.
[[mutation]]
name = "a plugin is installed before its marketplace is registered"
file = "src/stayfixed/setup/run.py"
before = """        added = runner.launch(add_argv_of(source), home)
        if added.code != 0:
            detail = answered(added)
            notes.append(f"{agent}: could not register marketplace {source} ({detail})")
            continue
        for selector in selectors:
            argv = install_argv_of(f"{selector}@{marketplace}")
            done = runner.launch(argv, home)
            if done.code == 0:
                if selector not in installed:
                    installed.append(selector)
            else:
                detail = answered(done)
                notes.append(f"{agent}: `{' '.join(argv)}` did not succeed ({detail})")"""
after = """        for selector in selectors:
            argv = install_argv_of(f"{selector}@{marketplace}")
            done = runner.launch(argv, home)
            if done.code == 0:
                if selector not in installed:
                    installed.append(selector)
            else:
                detail = answered(done)
                notes.append(f"{agent}: `{' '.join(argv)}` did not succeed ({detail})")
        added = runner.launch(add_argv_of(source), home)
        if added.code != 0:
            detail = answered(added)
            notes.append(f"{agent}: could not register marketplace {source} ({detail})")
            continue"""
reddens = ["tests/setup/test_setup.py::test_every_plugin_install_is_one_recorded_argv"]

