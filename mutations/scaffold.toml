reddens = [
  "tests/scaffold/test_manifest.py::test_a_format_that_is_not_a_positive_integer_is_damage_and_not_a_newer_stayfixed[0]",
  "tests/scaffold/test_manifest.py::test_a_format_that_is_not_a_positive_integer_is_damage_and_not_a_newer_stayfixed[-1]",
