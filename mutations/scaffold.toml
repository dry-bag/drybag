# The scaffold group: the engine that renders a repository's footprint, the manifest that records
# it, and the settings documents whose entries `attach` merges.
# Which group an entry belongs in is `GROUP_OF` in `scripts/mutation_oracle.py`; what an entry is:
# CONTRIBUTING.md, "Tests".

# An artifact's file is one a clone commits: the engine reads it to the read cap, a regular file
# only, and one past the cap is that artifact's refusal.
[[mutation]]
name = "the scaffold engine reads an artifact's file with no bound"
file = "src/stayfixed/scaffold/engine.py"
before = '        return read_regular_text(path, newline=""), None'
after = """        with path.open(encoding="utf-8", newline="") as stream:
            return stream.read(), None"""
reddens = [
  "tests/scaffold/test_engine.py::test_a_file_past_the_read_cap_refuses_only_its_own_artifact",
  "tests/scaffold/test_engine.py::test_a_fifo_at_an_artifacts_place_is_its_refusal_and_never_waited_on",
]

# A footprint manifest's `format` that is no integer is damage, refused as the manifest's other bad
# shapes are; read as a newer stayfixed's, it sent the owner to upgrade the plugin.
[[mutation]]
name = "a footprint manifest's format that is not an integer reads as a newer one"
file = "src/stayfixed/scaffold/manifest.py"
before = """        if not isinstance(version, int) or isinstance(version, bool) or version < 1:
            raise ManifestError(f"{MANIFEST_PATH}: 'format' is not a positive integer")
        if version > FORMAT:"""
after = """        if not isinstance(version, int) or version > FORMAT:"""
reddens = [
  "tests/scaffold/test_manifest.py::test_a_format_that_is_not_a_positive_integer_is_damage_and_not_a_newer_stayfixed",
]

[[mutation]]
name = "a footprint manifest's format below 1 is read"
file = "src/stayfixed/scaffold/manifest.py"
before = "        if not isinstance(version, int) or isinstance(version, bool) or version < 1:"
after = "        if not isinstance(version, int) or isinstance(version, bool):"
reddens = [
  "tests/scaffold/test_manifest.py::test_a_format_that_is_not_a_positive_integer_is_damage_and_not_a_newer_stayfixed[0]",
  "tests/scaffold/test_manifest.py::test_a_format_that_is_not_a_positive_integer_is_damage_and_not_a_newer_stayfixed[-1]",
]

# A clone chooses the manifest's size too: it is read to the read cap, and a fault is said without
# the path it was opened by.
[[mutation]]
name = "the footprint manifest is read with no bound"
file = "src/stayfixed/scaffold/manifest.py"
before = "            text = read_regular_text(path)"
after = '            text = path.read_text(encoding="utf-8")'
reddens = [
  "tests/scaffold/test_manifest.py::test_a_manifest_past_the_read_cap_is_unreadable_and_never_read_whole",
]

[[mutation]]
name = "the footprint manifest's read refusal prints the path it opened"
file = "src/stayfixed/scaffold/manifest.py"
before = "        with fsops.reading(MANIFEST_PATH, ManifestError):"
after = "        with fsops.reading(path, ManifestError):"
reddens = ["tests/scaffold/test_manifest.py::test_a_manifest_past_the_read_cap_is_unreadable_and_never_read_whole"]

# The ledger is tracked, so a clone can commit one nested past the parser or holding an integer
# longer than Python converts. Read through `jsonobject`, each is a refusal in the reader's own
# words; quoted, the refusal told the owner to raise an interpreter limit.
[[mutation]]
name = "the manifest reader quotes the parser's exception for a document past its reach"
file = "src/stayfixed/scaffold/manifest.py"
before = "        raw = json_object(text, str(MANIFEST_PATH), error=ManifestError)"
after = """        try:
            raw = json.loads(text)
        except (ValueError, RecursionError) as exc:
            raise ManifestError(f"{MANIFEST_PATH} is unreadable: {exc}") from exc"""
reddens = [
  "tests/scaffold/test_manifest.py::test_a_manifest_past_the_parser_is_refused_in_its_own_words[long-number]",
  "tests/scaffold/test_manifest.py::test_a_manifest_past_the_parser_is_refused_in_its_own_words[nested]",
]

# A refusal returned in a report rather than raised: every recorded artifact refused.

[[mutation]]
name = 'the engine refuses every recorded artifact'
file = "src/stayfixed/scaffold/engine.py"
before = '        if reason is not None:'
after = '        if reason is not None or record is not None:'
reddens = [
  "tests/scaffold/test_engine.py::test_a_recorded_unchanged_file_yields_no_action",
  "tests/scaffold/test_engine.py::test_a_recorded_file_the_tool_wrote_is_updated",
]

# git ends a line at `\n` alone. Read as ending at a lone `\r` too, an exclude file whose last line
# was `/zz\r` counted as ended, the block's begin marker was glued onto it, and `zz` showed in
# `git status` while the repository was attached.
[[mutation]]
name = "a hash region reads a lone carriage return as a line end"
file = "src/stayfixed/scaffold/regions.py"
before = '    return line.endswith("\n") if style is Style.HASH else line.endswith(("\n", "\r"))'
after = '    return line.endswith(("\n", "\r"))'
reddens = [
  "tests/scaffold/test_regions.py::test_a_hash_region_reads_lines_where_git_does",
  "tests/attach/test_detach.py::test_an_exclude_file_ending_in_a_lone_carriage_return_keeps_its_last_pattern",
]

[[mutation]]
name = "a hash region finds a marker across a lone carriage return"
file = "src/stayfixed/scaffold/regions.py"
before = "    pattern = _GIT_LINE if style is Style.HASH else _LINE"
after = "    pattern = _LINE"
reddens = ["tests/scaffold/test_regions.py::test_a_hash_region_reads_lines_where_git_does"]

# git drops one `\r` before the `\n` that ends a line. A file holding `\r\n` whose last line ended
# `/zz\r` got `\r\n` appended, git read `/zz\r`, and `zz` showed while attached.
[[mutation]]
name = "a hash region ends a line after a lone carriage return with the file's own ending"
file = "src/stayfixed/scaffold/regions.py"
before = '            lone_cr = style is Style.HASH and head[-1].endswith("\r")'
after = "            lone_cr = False"
reddens = [
  "tests/attach/test_write.py::test_the_exclude_block_hides_what_git_hid_and_gives_every_file_back",
]

# A document past a limit of the parser is refused as its own kind of `EntriesError`, so `doctor` can
# tell it from a malformed one by name and every caller catching `EntriesError` still catches it.
[[mutation]]
name = "a document past a limit of the parser is refused outside the entries refusal"
file = "src/stayfixed/scaffold/entries.py"
before = "class ParserLimitError(EntriesError):"
after = "class ParserLimitError(Refusal):"
reddens = [
  "tests/scaffold/test_surface.py::test_a_document_past_a_limit_of_the_parser_is_an_entries_refusal_of_its_own_kind",
]

# An artifact the engine cannot read is named relative to the project, its reason in words: the
# error's own text carries the absolute path, this machine's layout, twice.
[[mutation]]
name = "the scaffold engine names an unreadable artifact by its absolute path"
file = "src/stayfixed/scaffold/engine.py"
before = "        return None, unreadable(quoted(relative), exc)"
after = "        return None, unreadable(path, exc)"
reddens = [
  "tests/scaffold/test_engine.py::test_an_unreadable_artifact_is_named_relative_to_the_project_with_the_reason_in_words[directory]",
  "tests/scaffold/test_engine.py::test_an_unreadable_artifact_is_named_relative_to_the_project_with_the_reason_in_words[too-large]",
  "tests/scaffold/test_engine.py::test_an_unreadable_artifact_is_named_relative_to_the_project_with_the_reason_in_words[not-utf8]",
]

# An artifact whose bytes are already the template's is left alone, so a second run of the same
# release plans nothing: planned again, every artifact reads as an update or as hand-edited.
[[mutation]]
name = "an artifact whose bytes are already the template's is planned again"
file = "src/stayfixed/scaffold/engine.py"
before = "        if digest(current) == digest(body):"
after = "        if False:"
reddens = [
  "tests/scaffold/test_engine.py::test_a_recorded_unchanged_file_yields_no_action",
]
