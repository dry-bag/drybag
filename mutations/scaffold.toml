after = """                f"'hooks.{event}' holds an entry group that is not an object""""
reddens = [
  "tests/scaffold/test_entries.py::test_an_event_a_refusal_names_is_printed_bounded[not-an-object]",
]

# An artifact's file is one a clone commits: the engine reads it to the read cap, a regular file
