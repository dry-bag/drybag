# The ledger is tracked, so a clone can commit one nested past the parser or holding an integer
# longer than Python converts. Read through `jsonobject`, each is a refusal in the reader's own
# words; quoted, the refusal told the owner to raise an interpreter limit.
[[mutation]]
name = "the manifest reader quotes the parser's exception for a document past its reach"
file = "src/stayfixed/scaffold/manifest.py"
before = "        raw = json_object(text, str(MANIFEST_PATH), error=ManifestError)"
after = """        try:
            raw = json.loads(text)
        except (ValueError, RecursionError) as exc:
            raise ManifestError(f"{MANIFEST_PATH} is unreadable: {exc}") from exc"""
reddens = [
  "tests/scaffold/test_manifest.py::test_a_manifest_past_the_parser_is_refused_in_its_own_words[long-number]",
  "tests/scaffold/test_manifest.py::test_a_manifest_past_the_parser_is_refused_in_its_own_words[nested]",
]

