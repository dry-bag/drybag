file = "src/stayfixed/scaffold/manifest.py"
before = """        if not isinstance(version, int) or isinstance(version, bool) or version < 1:
            raise ManifestError(f"{MANIFEST_PATH}: 'format' is not a positive integer")
        if version > FORMAT:"""
after = """        if not isinstance(version, int) or version > FORMAT:"""
