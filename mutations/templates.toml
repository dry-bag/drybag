# The templates group: the shipped overlay template and the presets.
# Which group an entry belongs in is `GROUP_OF` in `scripts/mutation_oracle.py`; what an entry is:
# CONTRIBUTING.md, "Tests".

# The one invariant here whose failure ships a permission to every machine that ever creates an
# overlay from the template. The plugin author may never grant one; only the machine owner may, on
# their own instance.
[[mutation]]
name = "the overlay template starts granting a permission"
file = "src/stayfixed/templates/overlay/common/claude/permissions.json"
before = '  "permissions": {}'
after = '  "permissions": {"allow": ["Bash(:*)"]}'
reddens = [
  "tests/overlay/test_template.py::test_the_template_ships_no_allow_rule_anywhere",
  "tests/overlay/test_template.py::test_the_template_ships_permissions_that_are_neither_granted_nor_pretended",
]

# --- the shipped data files: guards the external review proved shipped green (PR 12) ---
#
# Each mutates a file no type checker reads and no import reaches: a YAML workflow, a
# permissions table, a `.gitignore`. That is exactly why they are here. `hooks/run-hook.sh` has
# entries on the same argument -- CONTRIBUTING's rule is that a genuinely load-bearing guard goes
# into `mutations/` rather than only being described, and a `# Mutation: ...` comment in a test
# body is a description.

# The overlay's first secret scan, and the revision decides whose code runs on the owner's
# machine at every commit. The assertion this entry belongs to used to be `"rev:" in config`,
# which is true of every possible pre-commit configuration including this mutation's result --
# it is one of the six data-file guards the external review proved shipped green.
[[mutation]]
name = "the overlay template follows gitleaks' default branch"
file = "src/stayfixed/templates/overlay/.pre-commit-config.yaml"
before = "    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1"
after = "    rev: main"
reddens = [
  "tests/overlay/test_template.py::test_the_template_pins_gitleaks_at_a_revision",
]

# The `.env` deny rules, where they actually fire. The overlay template used to carry a second,
# smaller copy of them, asserted by value over there -- dead, because `attach.permissions` reads
# `permissions.allow` and never `permissions.deny`, and already one rule behind this list. That
# copy is gone; this is the proof that the live one is asserted by value and not by substring,
# which `["Read(.env)"]` would satisfy while leaving `.env.prod` readable.
[[mutation]]
name = "the preset stops denying the env files"
file = "src/stayfixed/presets/recommended.toml"
before = '  "Read(**/.env.prod)",'
after = '  "Read(**/.env.prd)",'
reddens = ["tests/setup/test_machine.py::test_the_preset_denies_reading_env_files_by_value"]

# And by name, never by a mask: a deny rule outranks every allow rule, so a mask that reaches
# `.env.example` refuses the template for good.
[[mutation]]
name = "the preset denies the env files by a mask again"
file = "src/stayfixed/presets/recommended.toml"
before = '  "Read(**/.env.test)",'
after = '  "Read(**/.env.*)",'
reddens = ["tests/setup/test_machine.py::test_no_preset_deny_rule_reaches_a_template"]

# The cheap half of the promise that the overlay never holds a credential. The assertion was `".env"
# in text`, and the word appears in the file's own explanatory comment -- so commenting out every
# pattern left it green with nothing ignored at all. This is that mutation.
[[mutation]]
name = "the overlay template stops ignoring env files"
file = "src/stayfixed/templates/overlay/.gitignore"
before = '''
.env
.env.*
'''
after = '''
# .env
# .env.*
'''
reddens = [
  "tests/overlay/test_template.py::test_the_template_ignores_env_files",
]

# `pull_request_target` runs with the base repository's secrets against a *fork's* head, which is
# the standard Actions privilege-escalation shape. Nothing in the suite read this file at all
# before the repair: the reviewer rewrote the trigger and the scopes together and all 43 cases
# passed, in a workflow that ships into every overlay a user creates.
[[mutation]]
name = "the overlay's secret scan runs a fork's head"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = "  pull_request:"
after = "  pull_request_target:"
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_never_runs_a_forks_head_with_the_repositorys_own_token",
]

# The other half of `mutations/`'s "the overlay's secret scan runs a fork's head", and the half that
# makes that one dangerous. A secret scan needs read scopes only (`contents`, and `pull-requests`
# for the action's reads of the pull request); a write scope on the token this workflow hands a
# third-party action is a repository that can be pushed to by whatever that action does.
[[mutation]]
name = "the overlay's secret scan is given a write token"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = '''permissions:
  contents: read'''
after = '''permissions:
  contents: write
  id-token: write'''
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_never_runs_a_forks_head_with_the_repositorys_own_token",
]

# The permission the action's pull-request scan cannot run without. On `pull_request` it lists the
# pull request's commits through `GET /repos/{owner}/{repo}/pulls/{n}/commits`, and a private
# repository -- an overlay is one by design -- answers that to a token holding `pull-requests: read`
# only. A `permissions:` block that names `contents` alone sets every other scope to none.
[[mutation]]
name = "the overlay's secret scan cannot list a pull request's commits"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = """permissions:
  contents: read
  pull-requests: read"""
after = """permissions:
  contents: read"""
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_can_read_a_pull_requests_commits_in_a_private_repository",
]

# The same argument `mutations/`'s "the overlay template follows gitleaks' default branch" makes
# about `rev:`, one file over and with a token attached. A major tag is a name its owner can move,
# so `@v7` resolving to different code tomorrow is somebody else choosing what runs against a
# repository holding the owner's rules and notes. A full-length commit sha is the only immutable
# reference Actions has (principle 9).
[[mutation]]
name = "the overlay's secret scan follows a moveable action tag"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1"
after = "actions/checkout@v7"
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_pins_every_action_at_an_immutable_revision",
]

# The same mutation as `mutations/`'s "the overlay's secret scan follows a moveable action tag", for
# the workflow's other pin. The test loops over every `uses:` line, so each pin needs its own
# mutation to show the loop examines it: `@v3` is a name the action's owner can move, and this step
# is the one that holds the repository's token.
[[mutation]]
name = "the overlay's secret scan follows a moveable gitleaks-action tag"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = "gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0"
after = "gitleaks/gitleaks-action@v3"
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_pins_every_action_at_an_immutable_revision",
]

# A job's own `permissions:` block replaces the workflow's, it does not add to it. The workflow-level
# block can therefore read exactly `contents: read` and `pull-requests: read` while the job holds
# `read-all`, or `contents: read` alone, and every assertion over the top-level block stays green.
[[mutation]]
name = "the overlay's secret scan sets its own permissions on the job"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = "    runs-on: ubuntu-latest"
after = """    runs-on: ubuntu-latest
    permissions: read-all"""
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_can_read_a_pull_requests_commits_in_a_private_repository",
]

# `actions/checkout` persists the token it was given into the repository's git configuration for
# every later step, and this job never pushes.
[[mutation]]
name = "the overlay's secret scan checks out with a persisted token"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = "          persist-credentials: false"
after = "          persist-credentials: true"
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_checkout_leaves_no_token_behind",
]

# The public template repository is organisation-owned, so the action fails every run there for
# want of a licence key. Without the condition the template's own badge is red from the day it is
# published; with the condition inverted, the template is scanned and every overlay is skipped.
[[mutation]]
name = "the overlay's secret scan runs on the template repository"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = "    if: ${{ !github.event.repository.is_template }}"
after = "    if: ${{ true }}"
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_skips_a_repository_marked_as_a_template_and_scans_the_rest",
]

[[mutation]]
name = "the overlay's secret scan skips every repository made from the template"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = "    if: ${{ !github.event.repository.is_template }}"
after = "    if: ${{ github.event.repository.is_template }}"
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_skips_a_repository_marked_as_a_template_and_scans_the_rest",
]

# gitleaks-action v3.0.0 downloads its own default gitleaks (8.24.3) unless `GITLEAKS_VERSION` says
# otherwise, and pinning the action at a sha does not pin that binary. The workflow is the scan that
# cannot be skipped, so it names the release the hook pins; these three break that agreement in the
# three ways it can break.
[[mutation]]
name = "the overlay's secret scan runs the action's older default gitleaks"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = '          GITLEAKS_VERSION: "8.30.1"'
after = '          # GITLEAKS_VERSION: "8.30.1"'
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_runs_the_gitleaks_the_pre_commit_hook_pins",
]

[[mutation]]
name = "the overlay's secret scan runs a different gitleaks than the hook"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = '          GITLEAKS_VERSION: "8.30.1"'
after = '          GITLEAKS_VERSION: "8.24.3"'
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_runs_the_gitleaks_the_pre_commit_hook_pins",
]

[[mutation]]
name = "the overlay template's hook goes back to naming gitleaks by its tag"
file = "src/stayfixed/templates/overlay/.pre-commit-config.yaml"
before = "    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1"
after = "    rev: v8.30.1"
reddens = [
  "tests/overlay/test_template.py::test_the_template_pins_gitleaks_at_a_revision",
  "tests/overlay/test_template.py::test_the_scan_workflow_runs_the_gitleaks_the_pre_commit_hook_pins",
]

# The author-side trust rule's other half for the template: a hook shipped by the author executes on
# every machine that creates an instance. The assertion examined only files carrying a `hooks` key,
# so a hook under a bare top-level event key -- the shape `.codex/hooks.json` uses -- was not
# examined at all.
[[mutation]]
name = "the overlay template ships a hook under a bare event key"
file = "src/stayfixed/templates/overlay/common/claude/hooks.json"
before = '''{
  "hooks": {}
}'''
after = '''{
  "PreToolUse": [
    {"matcher": "Bash", "hooks": [{"type": "command", "command": "curl e"}]}
  ]
}'''
reddens = [
  "tests/overlay/test_template.py::test_the_template_ships_no_hook_entry",
]

# Three claims were held true by reading, and one had already drifted back: the template README said
# "fifteen files" while a rendered overlay has sixteen — the scaffold engine writes
# `.stayfixed/manifest.json`, which is in neither of that README's tables and is the file `overlay
# upgrade` keys on. The denominator is `OVERLAY_FILES` plus that path, so a change that adds a
# template file now reddens the document instead of outliving it. The template ships fourteen
# files today and a create leaves fifteen, and the count below moved with each change to them. This
# entry is an inline count too, so it has to move as well; the unfiltered oracle is what says so,
# because a run filtered to one change's own entries cannot see an entry declared earlier that the
# change invalidated.
[[mutation]]
name = "the overlay README stops counting the manifest"
file = "src/stayfixed/templates/overlay/README.md"
before = "`stayfixed setup --overlay <path>` renders twelve files here:"
after = "`stayfixed setup --overlay <path>` renders thirteen files here:"
reddens = [
  "tests/overlay/test_template.py::test_the_overlay_readme_counts_the_files_a_create_actually_leaves",
]

# The template's pins are full-length shas and a sha rots in silence; the Dependabot file is the
# only thing that moves them. Point it at another ecosystem and it watches nothing while still
# looking like a configuration.
[[mutation]]
name = "the template's dependabot configuration stops naming the actions ecosystem"
file = "src/stayfixed/templates/overlay/.github/dependabot.yml"
before = "  - package-ecosystem: github-actions"
after = "  - package-ecosystem: npm"
reddens = ["tests/overlay/test_template.py::test_the_template_ships_a_dependabot_configuration_for_its_pinned_actions"]

# The `_enum` class, at two more sites: `mutations/`'s "a preset name outside the rule is quoted
# back again" and "a preset this build does not ship is quoted back again". Each refusal is reached
# by a value a clone writes into `stayfixed.toml` — `[stayfixed] preset` — and each ran `{name!r}`
# into a message the skills relay to a terminal and a model. The first runs exactly for a value
# that failed its rule, so it could carry ESC and line breaks; the second is reached only by a name
# that passed, and could still carry an instruction spelled in letters. The anchor is
# stayfixed's own vocabulary: the key, the rule in words, and the listing this build ships. Each
# mutation puts the value back into its message.
[[mutation]]
name = "a preset name outside the rule is quoted back again"
file = "src/stayfixed/presets/__init__.py"
before = '        raise Failure(f"{key} is not a plain identifier ({NAME_RULE}); {available()}")'
after = '        raise Failure(f"{key} {name!r} is not a plain identifier ({NAME_RULE}); {available()}")'
reddens = [
  "tests/scaffold/test_containment.py::test_a_preset_name_outside_the_identifier_rule_is_refused_and_never_quoted",
  "tests/scaffold/test_containment.py::test_load_preset_names_the_key_its_caller_passes",
]

[[mutation]]
name = "a preset this build does not ship is quoted back again"
file = "src/stayfixed/presets/__init__.py"
before = '            f"{key} names a preset this version of stayfixed does not ship; {available()}"'
after = '            f"{key} names {name!r}, which this version of stayfixed does not ship; {available()}"'
reddens = [
  "tests/scaffold/test_containment.py::test_a_preset_this_build_does_not_ship_is_refused_and_never_quoted",
]

# Membership was the filesystem's answer, and macOS folds case, so `"RECOMMENDED"` loaded on a Mac
# and was refused on Linux. The case-folding test reddens only on a case-insensitive filesystem, and
# the CI oracle runs on Linux, so the proof is the case that empties the listing: `recommended.toml`
# stays on disk, and only the listing refuses it.
[[mutation]]
name = "preset membership is asked of the filesystem again"
file = "src/stayfixed/presets/__init__.py"
before = "    if name not in shipped_presets():"
after = '    if not resources.files(__package__).joinpath(f"{name}.toml").is_file():'
reddens = [
  "tests/scaffold/test_containment.py::test_preset_membership_is_the_listings_answer_and_not_the_filesystems",
]

# One ASCII grammar for the name, which is what the sentence printed with it says.
[[mutation]]
name = "the preset rule admits any Unicode letter again"
file = "src/stayfixed/presets/__init__.py"
before = "    if not NAME.match(name):"
after = '    if not name.replace("-", "").replace("_", "").isalnum():'
reddens = [
  "tests/scaffold/test_containment.py::test_a_preset_name_with_a_non_ascii_letter_is_refused_by_the_rule",
]

# `LISTED_LIMIT` on the rest of the class: every list of names the repository or its history
# bounds in number by nothing, on a summary line or in a refusal, takes `findings.listed`.

# A preset is parsed once per process, and every load hands its caller a copy of that parse.
[[mutation]]
name = "the preset is parsed on every load"
file = "src/stayfixed/presets/__init__.py"
before = "    return copy.deepcopy(_parsed(name))"
after = "    return copy.deepcopy(_parsed.__wrapped__(name))"
reddens = ["tests/config/test_session.py::test_a_session_parses_its_preset_once"]

[[mutation]]
name = "a caller's edit of a loaded preset reaches the next load"
file = "src/stayfixed/presets/__init__.py"
before = "    return copy.deepcopy(_parsed(name))"
after = "    return _parsed(name)"
reddens = ["tests/config/test_schema.py::test_a_loaded_preset_is_the_callers_own_copy"]

