# Committed provenance. `Template.source` becomes `Record.template` in `.stayfixed/manifest.json`,
# which is tracked and is where a reader finds out where an artifact's bytes came
# from. Three artifacts here compute their bytes rather than reading a shipped file, and all three
# recorded `project/<id>` — a name `PROJECT_FILES` does not carry, that the wheel does not ship,
# and that `read` refuses by name. Nothing raised, because each one overrides `render`; what was
# written was a pointer at nothing, and the committed smoke fixture's manifest carried
# `"template": "project/gitignore"` from the day it was grown. The mutation restores that
# spelling, and both ends of the rule redden: the two-rule guard over what this module builds, and
# the fixture's own manifest held to what this build would write for it.
[[mutation]]
name = "a computed artifact records a shipped template name the wheel does not ship"
file = "src/stayfixed/project/templates.py"
before = '        source=f"{COMPUTED}/{artifact_id}",'
after = '        source=f"{PROJECT}/{artifact_id}",'
reddens = [
  "tests/project/test_templates.py::test_every_source_both_passes_build_is_a_shipped_file_or_is_declared_computed",
  "tests/project/test_fixture.py::test_the_smoke_fixture_is_a_project_init_has_nothing_left_to_create_in",
]

# The `_enum` class, at four more sites, in two pairs: `mutations/`'s "a preset name outside the
# rule is quoted back again" and "a preset this build does not ship is quoted back again", then
# `mutations/`'s "a profile outside one path segment is quoted back again" and "a profile the
# listing lacks is quoted back again". Each refusal is reached by a value a clone writes into
# `stayfixed.toml` — `[stayfixed] preset` or `[stayfixed] profile` — and each ran `{name!r}` into a
# message the skills relay to a terminal and a model. The first of each pair runs exactly for a
# value that failed its rule, so it could carry ESC and line breaks; the second is reached only by a
# name that passed, and could still carry an instruction spelled in letters. The anchor is
# stayfixed's own vocabulary: the key, the rule in words, and the listing this build ships. Each
# mutation puts the value back into its message.
[[mutation]]
name = "a preset name outside the rule is quoted back again"
file = "src/stayfixed/presets/__init__.py"
before = '        raise Failure(f"{key} is not a plain identifier ({NAME_RULE}); {available()}")'
after = '        raise Failure(f"{key} {name!r} is not a plain identifier ({NAME_RULE}); {available()}")'
reddens = [
  "tests/scaffold/test_containment.py::test_a_preset_name_outside_the_identifier_rule_is_refused_and_never_quoted",
  "tests/scaffold/test_containment.py::test_load_preset_names_the_key_its_caller_passes",
]

[[mutation]]
name = "a preset this build does not ship is quoted back again"
file = "src/stayfixed/presets/__init__.py"
before = '            f"{key} names a preset this version of stayfixed does not ship; {available()}"'
after = '            f"{key} names {name!r}, which this version of stayfixed does not ship; {available()}"'
reddens = [
  "tests/scaffold/test_containment.py::test_a_preset_this_build_does_not_ship_is_refused_and_never_quoted",
]

