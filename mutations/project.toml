reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_pins_every_action_at_an_immutable_revision",
]

# A job's own `permissions:` block replaces the workflow's, it does not add to it. The workflow-level
# block can therefore read exactly `contents: read` and `pull-requests: read` while the job holds
# `read-all`, or `contents: read` alone, and every assertion over the top-level block stays green.
[[mutation]]
name = "the overlay's secret scan sets its own permissions on the job"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = "    runs-on: ubuntu-latest"
after = """    runs-on: ubuntu-latest
    permissions: read-all"""
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_can_read_a_pull_requests_commits_in_a_private_repository",
]

# `actions/checkout` persists the token it was given into the repository's git configuration for
