# The third half of the stale-bytecode header read, and the same class as `mutations/`'s "a
# hash-based .pyc is read as if it carried an mtime": PEP 552 bytes 8-12 are this interpreter's
# recorded source mtime only when bytes 0-4 are this interpreter's magic. A `__pycache__` keeps one
# `.pyc` per interpreter tag and nothing removes the old ones, so a `mod.cpython-311.pyc` records
# the mtime as of a run whose bytecode will never be imported again -- and any edit since makes it
