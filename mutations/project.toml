# Three claims were held true by reading, and one had already drifted back: the template README said
# "fifteen files" while a rendered overlay has sixteen — the scaffold engine writes
# `.stayfixed/manifest.json`, which is in neither of that README's tables and is the file `overlay
# upgrade` keys on. The denominator is `OVERLAY_FILES` plus that path, so a change that adds a
# template file now reddens the document instead of outliving it. The template ships fourteen
# files today and a create leaves fifteen, and the count below moved with each change to them. This
# entry is an inline count too, so it has to move as well; the unfiltered oracle is what says so,
# because a run filtered to one change's own entries cannot see an entry declared earlier that the
# change invalidated.
[[mutation]]
name = "the overlay README stops counting the manifest"
file = "src/stayfixed/templates/overlay/README.md"
before = "`stayfixed setup --overlay <path>` renders twelve files here:"
after = "`stayfixed setup --overlay <path>` renders thirteen files here:"
reddens = [
  "tests/overlay/test_template.py::test_the_overlay_readme_counts_the_files_a_create_actually_leaves",
]

# The template's pins are full-length shas and a sha rots in silence; the Dependabot file is the
# only thing that moves them. Point it at another ecosystem and it watches nothing while still
# looking like a configuration.
[[mutation]]
name = "the template's dependabot configuration stops naming the actions ecosystem"
file = "src/stayfixed/templates/overlay/.github/dependabot.yml"
before = "  - package-ecosystem: github-actions"
after = "  - package-ecosystem: npm"
reddens = ["tests/overlay/test_template.py::test_the_template_ships_a_dependabot_configuration_for_its_pinned_actions"]

# The second half of one rule: a remote URL's last path segment and a checkout's directory name are
# both repository-authored, so the value that fails the grammar is the one thing the refusal must
# not carry. The anchor is `PROJECT_NAME`, the loader's own grammar in the package, and the remedy —
# answer it with `--name`, or write `[project] name` yourself — is what a project whose directory
# this tool cannot name still has. The loader refuses the same grammar the same way.
[[mutation]]
name = "a detected name outside the grammar is quoted back in the refusal"
file = "src/stayfixed/project/detect.py"
before = '            raise Refusal(NOT_A_NAME)'
after = '            raise Refusal(f"{NOT_A_NAME}: {name}")'
reddens = [
  "tests/project/test_detect.py::test_a_name_outside_the_grammar_is_refused_without_being_quoted",
]

# Both passes are planned before either is applied, and that is the whole point: a refusal anywhere
# — a committed `AGENTS.md` whose `harness` region has an end marker and no beginning is the
# ordinary way one arrives — leaves nothing written and no manifest. The dry run is the same branch,
# which is what makes `--dry-run` honest rather than a second code path that happens to agree.
[[mutation]]
name = "init applies the write-once pass before it has looked at either plan's refusals"
file = "src/stayfixed/project/init.py"
before = "    if dry_run or report.refused:"
after = "    if False:"
reddens = [
  "tests/project/test_init.py::test_a_dry_run_writes_nothing_and_reports_both_plans",
  "tests/project/test_init.py::test_a_refused_footprint_writes_nothing_at_all",
]

# The manifest is the record that this repository has been initialised, and it is the only
# one: a second `init` over an initialised repository would re-plan every artifact against a
# configuration it rebuilt from scratch. The anchor is `.stayfixed/manifest.json`, whose path is the scaffold area's own constant and is
# contained against the root before it is read.
[[mutation]]
name = "init runs again over a repository whose manifest says it is already initialised"
file = "src/stayfixed/project/init.py"
before = "    if Manifest.present(root):"
after = "    if False:"
reddens = [
  "tests/project/test_init.py::test_an_initialised_repository_is_refused",
]

# One refusal, read off one relation (`templates.Owners`), for every pair of artifacts at one
# file: within a pass, where `scaffold.engine.plan` has no duplicate-target detection and two
# `[paths]` keys aimed at one file had `apply` write both and the manifest record two digests for
# one path; and across the two passes. The anchor is this module's artifact list; the refusal
# names two ids and their keys, never the value.
[[mutation]]
name = "an artifact may target a file another artifact is built to write"
file = "src/stayfixed/project/templates.py"
before = "    _no_file_of_another(prepared)\n"
after = ""
reddens = [
  "tests/project/test_templates.py::test_no_two_artifacts_of_one_pass_resolve_to_the_same_file",
  "tests/project/test_init.py::test_a_paths_value_naming_another_artifact_s_file_refuses_init_before_any_write",
  "tests/project/test_footprint_invariant.py::test_no_hostile_input_reaches_a_file_git_hides[a-paths-value-at-another-artifact-s-file-case-folded-init]",
]

