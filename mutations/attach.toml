# The attach group: binding a repository to its private overlay, and taking back what that wrote.
# Which group an entry belongs in is `GROUP_OF` in `scripts/mutation_oracle.py`; what an entry is:
# CONTRIBUTING.md, "Tests".

# The overlay root comes from the machine file, and this is the rule whose failure hands the choice
# of overlay to whoever wrote the command line -- which in this harness is a model that has read the
# repository. The machine file is unselectable by a repository by construction; `--store`'s own
# parent is not.
[[mutation]]
name = "attach takes the overlay root from its argument instead of the machine file"
file = "src/drybag/attach/binding.py"
# Widened past `read_binding`'s own line: `binding_for` has the same `record =
# machine_record(machine)` line, so a one-line `before` is not unique in this file — the oracle
# refuses rather than mutating an ambiguous match, so a non-unique `before` goes uncaught until a
# sweep broader than the entry's own filter string surfaces it.
#
# `read_binding` takes an optional `config` and loads only when the caller holds none, which is how
# the first of the two lines is spelled. The mutation is the second line -- the guard -- and the
# first is here only for uniqueness.
before = '''    config = load(root, machine=machine) if config is None else config
    record = machine_record(machine)
    overlay = record.overlay'''
after = '''    config = load(root, machine=machine) if config is None else config
    record = machine_record(machine)
    overlay = store.parents[2]'''
reddens = [
  "tests/attach/test_binding.py::test_the_overlay_root_comes_from_the_machine_file_and_not_from_the_argument",
]

# `--store` is checked against the overlay root `read_binding` read, and the binding is made under
# that same root. Handing the binding to `binding_for` reads the machine file a second time, so the
# store could be checked against one root and bound under another if the file changed in between.
[[mutation]]
name = "read_binding reads the machine file a second time for the binding"
file = "src/drybag/attach/binding.py"
before = "            f\"from an argument\"\n        )\n    return _bound(root, config, overlay, record.name, record.note)"
after = "            f\"from an argument\"\n        )\n    return binding_for(root, config, machine=machine)"
reddens = [
  "tests/attach/test_binding.py::test_read_binding_reads_the_machine_file_once",
]

