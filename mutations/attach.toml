before = '''    deny, mcp_ledger = planned.deny, replace(planned.mcp_held, deny=planned.deny.record)'''
after = '''    deny, mcp_ledger = planned.deny, planned.mcp_held'''
reddens = [
  "tests/attach/test_write.py::test_attach_takes_back_a_server_switched_off_later",
]

# `attach` refuses where git names no main checkout, so an MCP ledger there is none it wrote: no
# `claude mcp` runs on the names a clone could commit.
[[mutation]]
name = "detach takes back the MCP servers of a ledger in a bare repository's worktree"
file = "src/drybag/attach/write.py"
before = '''    held = read_mcp_ledger(root) if main is not None else McpLedger()'''
after = '''    held = read_mcp_ledger(root)'''
reddens = [
  "tests/attach/test_detach.py::test_detach_in_a_bare_repositorys_worktree_withdraws_this_checkouts_own_parts",
]

# A checkout bound on this machine is rebound to the project its `drybag.toml` now names only on
# `--project`: a pulled rename would otherwise move every worktree's servers, rules and hooks.
[[mutation]]
name = "attach rebinds a checkout to the project its drybag.toml names without --project"
file = "src/drybag/attach/binding.py"
before = "    if found is not None and found.project != named:\n        raise RebindRefused"
after = "    if False:\n        raise RebindRefused"
reddens = [
  "tests/attach/test_commands.py::test_a_reattach_under_another_project_name_is_refused_unless_project_names_it",
]
