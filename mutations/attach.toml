            raise Refusal(GROUP_ESCAPES) from exc'''
after = '''        except UnsafePath:
            pass'''
reddens = [
  "tests/attach/test_write.py::test_an_overlay_store_the_walk_cannot_enter_is_refused_at_write_time",
]

